---
name: Tag release
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - "!**"
      - "main"

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for conventional commits
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: --from-latest-tag
        continue-on-error: true
      - name: Get next version
        id: next_version
        run: |
          NEXT_VERSION=$(cog bump --auto --dry-run 2>/dev/null) || true
          if [ -z "$NEXT_VERSION" ]; then
            echo "No version bump needed, skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo NEXT_VERSION="$NEXT_VERSION" >> "$GITHUB_ENV"
          fi
      - name: Cocogitto tag
        id: release
        if: steps.next_version.outputs.skip != 'true'
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: "GitHubActions"
          git-user-email: "github@unicornops.ie"
      - name: Generate Changelog
        if: steps.next_version.outputs.skip != 'true'
        run: cog changelog --at ${{ steps.release.outputs.version }} -t full_hash > GITHUB_CHANGELOG.md
      - name: Upload github release
        if: steps.next_version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          body_path: GITHUB_CHANGELOG.md
          tag_name: ${{ steps.release.outputs.version }}
